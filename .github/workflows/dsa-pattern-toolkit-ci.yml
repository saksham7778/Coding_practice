name: DSA Pattern Toolkit CI

on:
  push:
    paths:
      - "dsa-pattern-toolkit/**"
      - ".github/workflows/dsa-pattern-toolkit-ci.yml"
  pull_request:
    paths:
      - "dsa-pattern-toolkit/**"
      - ".github/workflows/dsa-pattern-toolkit-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S dsa-pattern-toolkit -B dsa-pattern-toolkit/build
      - name: Build
        run: cmake --build dsa-pattern-toolkit/build --parallel
      - name: Test
        run: ctest --test-dir dsa-pattern-toolkit/build --output-on-failure
